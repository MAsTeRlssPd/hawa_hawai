AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Saans low-cost live air data API (OpenAQ + Open-Meteo + NASA FIRMS) with X-Ray, CloudTrail and a CloudWatch dashboard
Parameters:
  OpenAqParameterName:
    Type: String
    Default: /saans/prod/openaq-api-key
    Description: SSM SecureString parameter name. Create it after deployment; the API works with model data before then.
  FirmsParameterName:
    Type: String
    Default: /saans/prod/firms-map-key
    Description: SSM SecureString holding the NASA FIRMS MAP_KEY. Fire endpoints report not_configured until it exists.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Set to the deployed website origin before production use.
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: Bedrock model or inference profile for Ask Saans. Empty string uses the built-in rule-based answers only.
  AppUrl:
    Type: String
    Default: ''
    Description: Public website URL linked from alert emails.
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 20
    Tracing: Active
    Environment:
      Variables:
        CACHE_TABLE: !Ref AirCache
        OPENAQ_PARAMETER_NAME: !Ref OpenAqParameterName
        FIRMS_PARAMETER_NAME: !Ref FirmsParameterName
        POWERTOOLS_SERVICE_NAME: saans-api
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        FORECAST_BUCKET: !Ref ForecastBucket
        ALERTS_TOPIC: !Ref AlertsTopic
        SUBSCRIBERS_TABLE: !Ref AlertSubscribers
        APP_URL: !Ref AppUrl
Resources:
  # Delhi ward GNN forecasts land here hourly from the separate gnn/ stack (container Lambda).
  ForecastBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'saans-forecast-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  AirCache:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'saans-air-cache-${AWS::StackName}'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
  # Email alerts: one topic, per-subscriber filter policies; the table holds each subscriber's place and preferences.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'
      DisplayName: Saans
  AlertSubscribers:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'saans-alert-subscribers-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  AirApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","integrationMs":"$context.integrationLatency","userAgent":"$context.identity.userAgent"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
  AirDataFunction:
    Type: AWS::Serverless::Function
    DependsOn: AirDataLogGroup
    Properties:
      CodeUri: src/
      Handler: handler.handler
      FunctionName: !Sub '${AWS::StackName}-air-data'
      # HTTP API integrations give up at 30 s; trip planning (OSRM + per-cell forecasts) and Bedrock can take 10-20 s.
      Timeout: 29
      # No ReservedConcurrentExecutions: new accounts have a 10-execution limit and AWS rejects any reservation
      # that leaves fewer than 10 unreserved. API throttling below caps load instead.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AirCache
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertSubscribers
        - Statement:
            - Effect: Allow
              Action: [sns:Subscribe]
              Resource: !Ref AlertsTopic
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAqParameterName}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirmsParameterName}'
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
            # Cross-region inference profiles route to foundation models in other regions of the same geography.
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub '${ForecastBucket.Arn}/ward-forecast/*'
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
      Events:
        GetAir:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/air
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /health
            Method: GET
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/ask
            Method: POST
        Fires:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/fires
            Method: GET
        History:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/history
            Method: GET
        Geocode:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/geocode
            Method: GET
        Explain:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/explain
            Method: GET
        WardForecast:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/ward-forecast
            Method: GET
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/route
            Method: GET
        Alerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref AirApi
            Path: /v1/alerts
            Method: POST
  # Runs one step of the alerts state machine below: list subscribers, or alert one subscriber.
  AlertsFunction:
    Type: AWS::Serverless::Function
    DependsOn: AlertsLogGroup
    Properties:
      CodeUri: src/
      Handler: handler.alerts
      FunctionName: !Sub '${AWS::StackName}-alerts'
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AirCache
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertSubscribers
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAqParameterName}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirmsParameterName}'
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
            - Effect: Allow
              Action: [sns:Publish, sns:GetSubscriptionAttributes]
              Resource: [!Ref AlertsTopic, !Sub '${AlertsTopic}:*']
  # Step Functions, every hour at :05 (after the CAMS/OpenAQ hour turns over): list subscribers, then one task per
  # subscriber with retries. A failure is caught for that person only and shows in the execution graph.
  AlertsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${AWS::StackName}-alerts'
      Type: STANDARD
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref AlertsFunction
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 * * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
      DefinitionSubstitutions:
        AlertsFunctionArn: !GetAtt AlertsFunction.Arn
      Definition:
        Comment: Saans hourly email alerts
        StartAt: ListSubscribers
        States:
          ListSubscribers:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${AlertsFunctionArn}
              Payload:
                action: list
            OutputPath: $.Payload
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Next: AlertEachSubscriber
          AlertEachSubscriber:
            Type: Map
            ItemsPath: $.emails
            # New accounts have 10 concurrent Lambda executions; leave room for the API.
            MaxConcurrency: 3
            ItemSelector:
              email.$: $.Map.Item.Value
              now.$: $.Execution.StartTime
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: SendAlert
              States:
                SendAlert:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${AlertsFunctionArn}
                    Payload:
                      action: send
                      email.$: $.email
                      now.$: $.now
                  OutputPath: $.Payload
                  Retry:
                    - ErrorEquals: [States.ALL]
                      IntervalSeconds: 5
                      MaxAttempts: 2
                      BackoffRate: 3
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: AlertFailed
                  End: true
                AlertFailed:
                  Type: Pass
                  Parameters:
                    email.$: $.email
                    result: failed
                    error.$: $.error.Error
                  End: true
            End: true
  AlertsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-alerts'
      RetentionInDays: 14
  AirDataLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-air-data'
      RetentionInDays: 14
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-access'
      RetentionInDays: 14
  # CloudTrail: the account had no trail. The first trail's management events are free; S3 storage is pennies.
  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'saans-audit-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-audit-logs
            Status: Enabled
            ExpirationInDays: 90
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit'
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AuditBucket.Arn, !Sub '${AuditBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub '${AWS::StackName}-audit'
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      # Management events (who changed what, console sign-ins, IAM) plus every invoke of the API function.
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::Lambda::Function
              Values: [!GetAtt AirDataFunction.Arn]
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-ops'
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{"title":"API requests and errors","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/ApiGateway","Count","ApiId","${AirApi}"],[".","4xx",".","."],[".","5xx",".","."]]}},
          {"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{"title":"Lambda duration p50/p95 (ms)","region":"${AWS::Region}","period":300,
            "metrics":[["AWS/Lambda","Duration","FunctionName","${AirDataFunction}",{"stat":"p50"}],["...",{"stat":"p95"}]]}},
          {"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{"title":"Lambda errors and throttles","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/Lambda","Errors","FunctionName","${AirDataFunction}"],[".","Throttles",".","."]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Provider latency p95 (ms)","region":"${AWS::Region}","stat":"p95","period":300,
            "metrics":[["Saans","ProviderLatency","Provider","openaq"],["...","open_meteo_cams"],["...","open_meteo_weather"],["...","nasa_firms"],["...","open_meteo_era5"],["...","open_meteo_geocoding"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Provider errors","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["Saans","ProviderError","Provider","openaq"],["...","open_meteo_cams"],["...","open_meteo_weather"],["...","nasa_firms"],["...","open_meteo_era5"],["...","open_meteo_geocoding"]]}},
          {"type":"metric","x":0,"y":12,"width":8,"height":6,"properties":{"title":"Cache hits vs misses (air)","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["Saans","CacheHit","Route","air"],[".","CacheMiss",".","."]]}},
          {"type":"metric","x":8,"y":12,"width":8,"height":6,"properties":{"title":"Ask Saans answers by mode","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["Saans","AskAnswered","Mode","bedrock"],["...","rules"],[".","ExplainAnswered",".","bedrock"],["...","rules"]]}},
          {"type":"metric","x":16,"y":12,"width":8,"height":6,"properties":{"title":"FIRMS fire detections (India bbox, 24h)","region":"${AWS::Region}","stat":"Maximum","period":1800,
            "metrics":[["Saans","FireDetections","Days","1"]]}},
          {"type":"log","x":0,"y":18,"width":24,"height":6,"properties":{"title":"Slowest API requests","region":"${AWS::Region}",
            "query":"SOURCE '${ApiAccessLogGroup}' | fields time, method, path, status, latencyMs | sort latencyMs desc | limit 20"}}
        ]}
Outputs:
  ForecastBucketName:
    Description: Pass to the gnn/ stack as ForecastBucket
    Value: !Ref ForecastBucket
  ApiBaseUrl:
    Description: API base URL
    Value: !Sub 'https://${AirApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod'
  CacheTableName:
    Value: !Ref AirCache
  OpenAqParameterName:
    Value: !Ref OpenAqParameterName
  FirmsParameterName:
    Value: !Ref FirmsParameterName
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-ops'
  XRayTracesUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#xray:traces/query'
  AuditBucketName:
    Value: !Ref AuditBucket
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  AlertsStateMachineUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/states/home?region=${AWS::Region}#/statemachines/view/${AlertsStateMachine}'
